<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LogiPocket">
<meta name="theme-color" content="#0b2545">
<title>LogiPocket Student</title>
<style>
:root{--navy:#0b2545;--blue:#1d4ed8;--bg:#f1f5fb;--ink:#1e293b;--mut:#64748b;--ok:#15803d;--warn:#c2410c;--line:#dbe3ef}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai','Thonburi','Tahoma',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding-bottom:90px;overflow-wrap:anywhere}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-weight:700;border-bottom:4px solid #f97316}
header b{font-size:1.15rem}header small{display:block;opacity:.75;line-height:1.2}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
button.card{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}
h2{margin:0 0 8px;font-size:1.3rem;color:var(--navy)}h3{margin:14px 0 6px;font-size:1.05rem;color:var(--navy)}p{margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.btn{min-height:48px;padding:10px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:#e2e8f0;color:var(--navy)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
input,select{width:100%;min-height:48px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid #b6c3d8;border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:58px;border:0;border-top:3px solid transparent;background:none;font:inherit;font-size:.78rem;color:var(--mut);cursor:pointer}
nav button.on{color:var(--blue);font-weight:700;border-top-color:var(--blue)}
.res,.note{border-left:5px solid var(--ok);background:#ecfdf5;padding:12px;border-radius:10px;margin-top:12px}
.res.err,.note.w{border-left-color:var(--warn);background:#fff7ed}
.big{font-size:1.5rem;font-weight:700;color:var(--ok)}
.formula{background:#eff6ff;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--navy)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:#fff;border:2px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);cursor:pointer;min-height:48px}
.opt.sel{border-color:var(--blue);background:#eff6ff}.opt.good{border-color:var(--ok);background:#ecfdf5}.opt.bad{border-color:var(--warn);background:#fff7ed}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;min-height:44px;padding:8px 16px;border-radius:22px;border:1px solid #b6c3d8;background:#fff;font:inherit;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{display:inline-block;margin-left:8px;padding:0 10px;border-radius:10px;background:#dcfce7;color:var(--ok);font-size:.8rem}
.stat{font-size:1.4rem;font-weight:700;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
ul{padding-left:20px;margin:6px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f97316;outline-offset:2px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #b6c3d8;border-radius:10px;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;z-index:20;display:none;max-width:90%}
.ov{position:fixed;inset:0;background:rgba(11,37,69,.6);display:grid;place-items:center;padding:20px;z-index:30}.ov .card{max-width:420px;width:100%;margin:0}
.late{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">LP</div><div><b>LogiPocket Student</b><small>ผู้ช่วยนักศึกษาโลจิสติกส์และซัพพลายเชน</small></div></header>
<main id="app"></main>
<nav aria-label="เมนูหลัก">
<button data-act="go" data-v="home">หน้าแรก</button>
<button data-act="go" data-v="tools">คำนวณ</button>
<button data-act="go" data-v="dict">ศัพท์</button>
<button data-act="go" data-v="work">ของฉัน</button>
<button data-act="go" data-v="more">เพิ่มเติม</button>
</nav>
<script>
'use strict';
/* ---------- Storage (ปลอดภัยแม้ localStorage ใช้ไม่ได้) ---------- */
var mem={},LSOK=true;
try{localStorage.setItem('lps_t','1');localStorage.removeItem('lps_t')}catch(e){LSOK=false}
var store={
 get:function(k,d){if(LSOK){try{var v=localStorage.getItem('lps_'+k);if(v!==null)return JSON.parse(v)}catch(e){}}return (k in mem)?mem[k]:d},
 set:function(k,v){mem[k]=v;if(LSOK){try{localStorage.setItem('lps_'+k,JSON.stringify(v))}catch(e){LSOK=false}}}
};
var S={read:store.get('read',[]),best:store.get('best',0),done:store.get('done',0),game:store.get('game',0)};
if(!Array.isArray(S.read))S.read=[];
['best','done','game'].forEach(function(k){if(typeof S[k]!=='number'||!isFinite(S[k]))S[k]=0});
function save(){for(var k in S)store.set(k,S[k])}

/* ---------- Helpers ---------- */
function $(id){return document.getElementById(id)}
function fmt(n,d){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:d==null?4:d})}
function num(s){var t=String(s).trim().replace(/,/g,'');if(t==='')return NaN;return Number(t)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var ui={view:'home',tool:0,l:null,q:null,g:null,lastG:-1};

/* ---------- เครื่องมือคำนวณ ---------- */
var TOOLS=[
{name:'CBM',title:'CBM Calculator',desc:'คำนวณปริมาตรสินค้าเป็นลูกบาศก์เมตร (CBM) ใช้คิดค่าระวางและวางแผนการบรรทุก',
 formula:'CBM = ยาว × กว้าง × สูง (cm) × จำนวนชิ้น ÷ 1,000,000',
 f:[['l','ความยาว (cm)'],['w','ความกว้าง (cm)'],['h','ความสูง (cm)'],['n','จำนวนชิ้น','1']],
 calc:function(v){var c=v.l*v.w*v.h,per=c/1e6,tot=per*v.n;
  return{rows:[['ปริมาตรต่อชิ้น',fmt(per)+' CBM'],['ปริมาตรรวม',fmt(tot)+' CBM']],
  steps:[fmt(v.l)+' × '+fmt(v.w)+' × '+fmt(v.h)+' = '+fmt(c)+' cm³ ต่อชิ้น','หาร 1,000,000 → '+fmt(per)+' CBM ต่อชิ้น','คูณ '+fmt(v.n)+' ชิ้น → '+fmt(tot)+' CBM'],
  note:'1 CBM = 1 ลูกบาศก์เมตร (m³) ค่านี้ยังไม่รวมช่องว่างจากการจัดเรียงหรือบรรจุภัณฑ์เพิ่มเติม'}}},
{name:'Volumetric',title:'Volumetric Weight Calculator',desc:'คำนวณน้ำหนักตามปริมาตร (น้ำหนักเชิงปริมาตร) สำหรับงานขนส่ง',
 formula:'Volumetric Weight (kg) = ยาว × กว้าง × สูง (cm) ÷ ตัวหาร',
 f:[['l','ความยาว (cm)'],['w','ความกว้าง (cm)'],['h','ความสูง (cm)'],['n','จำนวนชิ้น','1']],
 sel:['d','ตัวหาร (Divisor)',[5000,6000,4000]],
 calc:function(v){var c=v.l*v.w*v.h,per=c/v.d,tot=per*v.n;
  return{rows:[['น้ำหนักตามปริมาตรต่อชิ้น',fmt(per)+' kg'],['น้ำหนักตามปริมาตรรวม',fmt(tot)+' kg']],
  steps:[fmt(v.l)+' × '+fmt(v.w)+' × '+fmt(v.h)+' = '+fmt(c)+' cm³','หารตัวหาร '+fmt(v.d)+' → '+fmt(per)+' kg ต่อชิ้น','คูณ '+fmt(v.n)+' ชิ้น → '+fmt(tot)+' kg'],
  note:'คำเตือน: ตัวหาร (เช่น 5,000 หรือ 6,000) และวิธีคิดค่าขนส่งจริงขึ้นอยู่กับผู้ให้บริการขนส่งและรูปแบบบริการ โดยทั่วไปค่าขนส่งมักคิดจากค่าที่มากกว่าระหว่างน้ำหนักจริงกับน้ำหนักตามปริมาตร ควรตรวจสอบเงื่อนไขกับผู้ให้บริการก่อนใช้งานจริง'}}},
{name:'Cost/Unit',title:'Cost per Unit Calculator',desc:'คำนวณต้นทุนต่อหน่วยจากต้นทุนรวม',
 formula:'ต้นทุนต่อหน่วย = ต้นทุนรวม ÷ จำนวนหน่วย',
 f:[['c','ต้นทุนรวม (บาท)'],['u','จำนวนหน่วย']],
 calc:function(v){var r=v.c/v.u;
  return{rows:[['ต้นทุนต่อหน่วย',fmt(r,2)+' บาท/หน่วย']],steps:[fmt(v.c,2)+' ÷ '+fmt(v.u)+' = '+fmt(r,2)+' บาท/หน่วย'],note:'ควรรวมต้นทุนทุกส่วนที่เกี่ยวข้อง เช่น ค่าขนส่ง ค่าคลัง และค่าแรง เพื่อให้ได้ต้นทุนที่สะท้อนความจริง'}}},
{name:'EOQ',title:'EOQ Calculator',desc:'คำนวณปริมาณการสั่งซื้อที่ประหยัดที่สุด (Economic Order Quantity)',
 formula:'EOQ = √((2 × D × S) ÷ H)',
 f:[['D','D: ความต้องการต่อปี (หน่วย)'],['S','S: ต้นทุนต่อการสั่งซื้อหนึ่งครั้ง (บาท)'],['H','H: ต้นทุนเก็บรักษาต่อหน่วยต่อปี (บาท)']],
 calc:function(v){var inner=2*v.D*v.S/v.H,q=Math.sqrt(inner),o=v.D/q;
  return{rows:[['EOQ',fmt(q,2)+' หน่วยต่อการสั่งซื้อ'],['จำนวนครั้งที่สั่งต่อปี',fmt(o,2)+' ครั้ง'],['รอบการสั่งซื้อ',fmt(365/o,1)+' วัน (ประมาณ)']],
  steps:['2 × '+fmt(v.D)+' × '+fmt(v.S)+' = '+fmt(2*v.D*v.S),'หารด้วย H = '+fmt(v.H)+' → '+fmt(inner,2),'ถอดรากที่สอง → '+fmt(q,2)+' หน่วย','จำนวนครั้งต่อปี = D ÷ EOQ = '+fmt(o,2)],
  note:'ความหมาย: ถ้าสั่งครั้งละประมาณ EOQ ผลรวมของต้นทุนสั่งซื้อและต้นทุนเก็บรักษาจะต่ำที่สุดภายใต้แบบจำลอง ค่านี้เป็นค่าประมาณ โดยสมมติว่าความต้องการคงที่ ต้นทุนคงที่ ไม่มีส่วนลดตามปริมาณ และไม่เกิดการขาดสต็อก ในทางปฏิบัติอาจปัดเป็นจำนวนเต็มหรือปรับตามขนาดบรรจุ'}}}
];
function toolView(){
 var t=TOOLS[ui.tool];
 var h='<h2>เครื่องมือคำนวณ</h2><div class="chips">'+TOOLS.map(function(x,i){return '<button class="chip'+(i===ui.tool?' on':'')+'" data-act="tool" data-i="'+i+'">'+x.name+'</button>'}).join('')+'</div>';
 h+='<div class="card"><h3 style="margin-top:0">'+t.title+'</h3><p>'+t.desc+'</p><p class="formula">'+t.formula+'</p>';
 t.f.forEach(function(f){h+='<label for="f_'+f[0]+'">'+f[1]+'</label><input id="f_'+f[0]+'" type="text" inputmode="decimal" autocomplete="off" value="'+(f[2]||'')+'">'});
 if(t.sel)h+='<label for="f_'+t.sel[0]+'">'+t.sel[1]+'</label><select id="f_'+t.sel[0]+'">'+t.sel[2].map(function(o){return '<option value="'+o+'">'+fmt(o)+'</option>'}).join('')+'</select>';
 h+='<div><button class="btn" data-act="calc">คำนวณ / คำนวณใหม่</button><button class="btn sec" data-act="clear">ล้างค่า</button></div><div id="out" aria-live="polite"></div></div>';
 return h;
}
function doCalc(){
 var t=TOOLS[ui.tool],v={},bad=[],o=$('out');
 t.f.forEach(function(f){var n=num($('f_'+f[0]).value);if(!isFinite(n)||n<=0||n>1e12)bad.push(f[1]);v[f[0]]=n});
 if(t.sel)v[t.sel[0]]=Number($('f_'+t.sel[0]).value);
 if(bad.length){o.innerHTML='<div class="res err"><b>ข้อมูลไม่ถูกต้อง</b><br>กรุณากรอกตัวเลขที่มากกว่า 0 ในช่อง: '+bad.join(', ')+'</div>';return}
 var r;try{r=t.calc(v)}catch(e){o.innerHTML='<div class="res err">คำนวณไม่สำเร็จ กรุณาตรวจสอบตัวเลข</div>';return}
 o.innerHTML='<div class="res">'+r.rows.map(function(x){return '<div>'+x[0]+'</div><div class="big">'+x[1]+'</div>'}).join('')+'<h3>วิธีคำนวณ</h3><ul>'+r.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul></div><div class="note w">'+r.note+'</div>';
}
function doClear(){var t=TOOLS[ui.tool];t.f.forEach(function(f){$('f_'+f[0]).value=f[2]||''});if(t.sel)$('f_'+t.sel[0]).selectedIndex=0;$('out').innerHTML=''}

/* ---------- บทเรียน ---------- */
var LESS=[
{t:'พื้นฐาน Logistics และ Supply Chain Management',
 obj:['อธิบายความหมายของ Logistics และ SCM','แยกความแตกต่างและความเชื่อมโยงของสองคำนี้'],
 body:['Logistics คือการวางแผน ดำเนินการ และควบคุมการไหลและการเก็บรักษาสินค้า บริการ และข้อมูล จากจุดต้นทางถึงปลายทางให้ตรงความต้องการของลูกค้า','Supply Chain Management (SCM) กว้างกว่า คือการบริหารและประสานงานทั้งเครือข่าย ตั้งแต่ซัพพลายเออร์ ผู้ผลิต ผู้กระจายสินค้า ผู้ค้าปลีก ไปจนถึงลูกค้า โดย Logistics เป็นส่วนสำคัญส่วนหนึ่งของ SCM','หมายเหตุ: ตำราแต่ละเล่มนิยามต่างกันเล็กน้อย ควรยึดนิยามตามรายวิชาของตนเอง'],
 terms:[['Supplier','ผู้จัดหาวัตถุดิบหรือสินค้า'],['Upstream / Downstream','ต้นน้ำ / ปลายน้ำของโซ่อุปทาน'],['Lead Time','ระยะเวลาตั้งแต่สั่งจนได้รับสินค้า']],
 ex:'ร้านกาแฟสั่งเมล็ดจากโรงคั่ว โรงคั่วสั่งจากเกษตรกร เมื่อทั้งสามฝ่ายแชร์ข้อมูลยอดขายและสต็อก จะลดทั้งของขาดและของล้น นี่คือแนวคิด SCM',
 sum:'Logistics คือการไหลของสินค้าและข้อมูล ส่วน SCM คือการประสานงานทั้งเครือข่ายตั้งแต่ต้นน้ำถึงปลายน้ำ'},
{t:'รูปแบบการขนส่ง: Road, Rail, Air, Sea และ Multimodal',
 obj:['เปรียบเทียบข้อดีข้อเสียของการขนส่งแต่ละแบบ','เลือกรูปแบบการขนส่งให้เหมาะกับสินค้า'],
 body:['Road (ทางถนน): ยืดหยุ่น ส่งถึงหน้าประตูได้ เหมาะระยะสั้นถึงกลาง','Rail (ทางราง): บรรทุกปริมาณมาก ต้นทุนต่อหน่วยค่อนข้างต่ำ แต่ขึ้นกับเส้นทางและตารางรถไฟ','Air (ทางอากาศ): เร็วที่สุดแต่ต้นทุนสูง เหมาะสินค้ามูลค่าสูง น้ำหนักเบา หรือเร่งด่วน','Sea (ทางเรือ): ต้นทุนต่อหน่วยต่ำ รับปริมาณมาก แต่ใช้เวลานาน','Multimodal: ใช้การขนส่งตั้งแต่สองรูปแบบขึ้นไปต่อเนื่องกัน มักอยู่ภายใต้สัญญาขนส่งฉบับเดียว','ค่าระวางมักคิดจากปริมาตร (CBM) หรือน้ำหนักตามปริมาตร ลองใช้เครื่องมือคำนวณในแอปนี้'],
 terms:[['CBM','ลูกบาศก์เมตร หน่วยวัดปริมาตร'],['Door-to-door','บริการส่งถึงหน้าประตู'],['Container','ตู้คอนเทนเนอร์']],
 ex:'ส่งสมาร์ตโฟนล็อตด่วนไปต่างประเทศมักใช้ Air แต่ส่งเฟอร์นิเจอร์จำนวนมากที่ไม่เร่งด่วนมักใช้ Sea',
 sum:'ไม่มีรูปแบบใดดีที่สุดเสมอไป ต้องชั่งน้ำหนักระหว่างต้นทุน เวลา ปริมาณ และลักษณะสินค้า'},
{t:'การบริหารคลังสินค้าและ WMS',
 obj:['บอกกิจกรรมหลักในคลังสินค้า','อธิบายหน้าที่ของ WMS'],

function startQuiz(ch){
 var pool=QZ.filter(function(q){return ch===null||q[0]===ch});
 ui.q={ch:ch,i:0,sc:0,sel:null,ans:false,fin:false,list:shuffle(pool).map(function(q){return{q:q[1],e:q[3],o:shuffle(q[2].map(function(t,i){return{t:t,ok:i===0}}))}})};
 ui.view='quiz';render();window.scrollTo(0,0);
}
function quizView(){
 var q=ui.q;
 if(!q)return '<h2>แบบฝึกหัดและแบบทดสอบ</h2><div class="card"><p>แบบทดสอบ 15 ข้อ ครอบคลุม 6 บท ลำดับข้อและตัวเลือกจะสุ่มใหม่ทุกครั้ง</p><p>คะแนนสูงสุดของคุณ: <b>'+fmt(S.best,0)+'%</b> | ทำแล้ว <b>'+S.done+'</b> ครั้ง</p><button class="btn" data-act="qall">เริ่มทำแบบทดสอบทั้งหมด</button></div><h3>หรือเลือกทำทีละบท</h3>'+LESS.map(function(l,i){return '<button class="card" data-act="qch" data-i="'+i+'">บทที่ '+(i+1)+' '+l.t+'</button>'}).join('');
 if(q.fin){var p=Math.round(q.sc/q.list.length*100);return '<div class="card"><h2>ผลการทำแบบทดสอบ</h2><p class="big">'+q.sc+' / '+q.list.length+' ('+p+'%)</p><p>'+(p>=80?'ยอดเยี่ยม! คุณเข้าใจเนื้อหาได้ดี':p>=50?'ผ่านเกณฑ์ ลองทบทวนบทที่พลาดแล้วทำใหม่':'ลองกลับไปอ่านบทเรียนอีกครั้งแล้วทำใหม่')+'</p><p>คะแนนสูงสุด: <b>'+fmt(S.best,0)+'%</b></p><button class="btn" data-act="qredo">ทำข้อสอบใหม่ (สุ่มลำดับ)</button><button class="btn sec" data-act="qend">กลับหน้าแบบทดสอบ</button></div>'}
 var c=q.list[q.i];
 var h='<div class="card"><p>ข้อ '+(q.i+1)+' / '+q.list.length+'</p><div class="bar"><i style="width:'+(q.i/q.list.length*100)+'%"></i></div><h3 style="margin-top:0">'+c.q+'</h3>';
 c.o.forEach(function(o,i){var cl='opt';if(q.ans){if(o.ok)cl+=' good';else if(i===q.sel)cl+=' bad'}else if(i===q.sel)cl+=' sel';h+='<button class="'+cl+'" data-act="sel" data-i="'+i+'">'+o.t+'</button>'});
 if(!q.ans)h+='<button class="btn" data-act="submit">ส่งคำตอบ</button><div id="qmsg" aria-live="polite"></div>';
 else{var ok=c.o[q.sel].ok;h+='<div class="res'+(ok?'':' err')+'"><b>'+(ok?'ถูกต้อง':'ยังไม่ถูก')+'</b><br>'+c.e+'</div><button class="btn" data-act="next">'+(q.i+1>=q.list.length?'ดูคะแนน':'ข้อถัดไป')+'</button>'}
 return h+'</div>';
}
function qSubmit(){var q=ui.q;if(q.sel===null){$('qmsg').innerHTML='<div class="note w">กรุณาเลือกคำตอบก่อนส่ง</div>';return}q.ans=true;if(q.list[q.i].o[q.sel].ok)q.sc++;render()}
function qNext(){var q=ui.q;q.i++;q.sel=null;q.ans=false;if(q.i>=q.list.length){q.fin=true;var p=Math.round(q.sc/q.list.length*100);if(p>S.best)S.best=p;S.done++;save()}render();window.scrollTo(0,0)}

function gScore(s,p){var okc=p[1]<=s.b,okt=p[2]<=s.h;if(!okc||!okt)return{s:0,ok:false,why:(okc?'':'เกินงบประมาณ ')+(okt?'':'ส่งไม่ทันกำหนด')};return{s:Math.round(40+s.wc*(1-p[1]/s.b)+s.wt*(1-p[2]/s.h)),ok:true,why:''}}

 var r=gScore(s,s.p[g.sel]),all=s.p.map(function(p){return gScore(s,p)});
 var best=0;all.forEach(function(x,i){if(x.s>all[best].s)best=i});
 var ch=0,fa=0;s.p.forEach(function(p,i){if(p[1]<s.p[ch][1])ch=i;if(p[2]<s.p[fa][2])fa=i});
 function d(i){return all[i].ok?'ได้ '+all[i].s+' คะแนน':'ไม่ผ่านเงื่อนไข ('+all[i].why.trim()+')'}
 h+='<div class="res'+(r.ok?'':' err')+'"><b>คุณเลือกแผน '+s.p[g.sel][0]+': '+(r.ok?'ผ่านเงื่อนไข ได้ '+r.s+' คะแนน':'ไม่ผ่าน ('+r.why.trim()+') ได้ 0 คะแนน')+'</b></div>';
 h+='<h3>สรุปบทเรียน</h3><ul><li>แผนที่ถูกที่สุด (แผน '+s.p[ch][0]+'): '+d(ch)+'</li><li>แผนที่เร็วที่สุด (แผน '+s.p[fa][0]+'): '+d(fa)+'</li><li>แผนที่ได้คะแนนสูงสุดคือแผน '+s.p[best][0]+' ('+all[best].s+' คะแนน)</li></ul><p>คะแนนคิดจาก 40 คะแนนเมื่อผ่านเงื่อนไขทั้งงบและเวลา บวกคะแนนความประหยัดและความเร็วตามน้ำหนักของสถานการณ์นี้ (ประหยัด '+s.wc+' / เร็ว '+s.wt+') การเลือกแผนที่ถูกที่สุดอาจส่งไม่ทัน และแผนที่เร็วที่สุดอาจจ่ายแพงเกินความจำเป็น</p><p>คะแนนสะสม: <b>'+fmt(S.game,0)+'</b></p><button class="btn" data-act="gstart">เล่นอีกครั้ง</button><button class="btn sec" data-act="gend">กลับ</button></div>';
 return h;

function gStart(){var n;do{n=Math.floor(Math.random()*GM.length)}while(GM.length>1&&n===ui.lastG);ui.lastG=n;ui.g={s:n,sel:null,done:false};ui.view='game';render()}

/* ---------- ตัวควบคุมหลัก ---------- */
function render(){
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===ui.view)});
 var V={home:homeView,tools:toolView,lessons:lessonsView,quiz:quizView,game:gameView};
 $('app').innerHTML=V[ui.view]();
}
function go(v){ui.view=v;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,i=Number(b.dataset.i);
 try{
 switch(a){
  case 'go':go(b.dataset.v);break;
  case 'tool':ui.tool=i;render();break;
  case 'gotool':ui.tool=i;go('tools');break;
  case 'calc':doCalc();break;
  case 'clear':doClear();break;
  case 'lopen':ui.l=i;go('lessons');break;
  case 'lback':ui.l=null;render();window.scrollTo(0,0);break;
  case 'lread':var k=S.read.indexOf(ui.l);if(k>-1)S.read.splice(k,1);else S.read.push(ui.l);save();render();break;
  case 'lquiz':startQuiz(i);break;
  case 'qall':startQuiz(null);break;
  case 'qch':startQuiz(i);break;
  case 'qredo':startQuiz(ui.q.ch);break;
  case 'qend':ui.q=null;render();break;
  case 'sel':if(!ui.q.ans){ui.q.sel=i;render()}break;
  case 'submit':qSubmit();break;
  case 'next':qNext();break;
  case 'gstart':gStart();break;
  case 'gsel':if(!ui.g.done){ui.g.sel=i;render()}break;
  case 'gconfirm':gConfirm();break;
  case 'gend':ui.g=null;render();break;
  case 'reset_old':if(confirm('ต้องการล้างความคืบหน้าทั้งหมดหรือไม่')){S={read:[],best:0,done:0,game:0};save();render()}break;
 }
 }catch(err){console.error(err)}
});

function toolView(){
 var t=TOOLS[ui.tool],k='t:'+t.name;
 var h='<h2>เครื่องมือคำนวณ</h2><div class="chips">'+TOOLS.map(function(x,i){return '<button class="chip'+(i===ui.tool?' on':'')+'" data-act="tool" data-i="'+i+'">'+x.name+'</button>'}).join('')+'</div>';
 h+='<div class="card"><h3 style="margin-top:0">'+t.title+'</h3><p>'+t.desc+'</p><p class="formula">'+t.formula+'</p>'+(t.ex?'<p><b>ตัวอย่าง:</b> '+t.ex+'</p>':'');
 t.f.forEach(function(f){h+='<label for="f_'+f[0]+'">'+f[1]+'</label><input id="f_'+f[0]+'" type="text" inputmode="decimal" autocomplete="off" value="'+(f[2]||'')+'">'});
 if(t.sel)h+='<label for="f_'+t.sel[0]+'">'+t.sel[1]+'</label><select id="f_'+t.sel[0]+'">'+t.sel[2].map(function(o){var a=Array.isArray(o);return '<option value="'+(a?o[0]:o)+'">'+(a?o[1]:fmt(o))+'</option>'}).join('')+'</select>';
 return h+'<div><button class="btn" data-act="calc">คำนวณ / คำนวณใหม่</button><button class="btn sec" data-act="clear">ล้างค่า</button><button class="btn sec" data-act="fav" data-k="'+esc(k)+'">'+favLbl(k)+'</button></div><div id="out" aria-live="polite"></div></div>';
}
function doCalc(){
 var t=TOOLS[ui.tool],v={},bad=[],o=$('out');
 t.f.forEach(function(f){var n=num($('f_'+f[0]).value),z=f[3]==='z';if(!isFinite(n)||n>1e12||(z?n<0:n<=0))bad.push(f[1]);v[f[0]]=n});
 if(t.sel)v[t.sel[0]]=Number($('f_'+t.sel[0]).value);
 if(bad.length){o.innerHTML='<div class="res err"><b>ข้อมูลไม่ถูกต้อง</b><br>กรอกเป็นตัวเลข ห้ามติดลบ และช่องหลักต้องมากกว่า 0 ในช่อง: '+bad.join(' | ')+'</div>';return}
 var r;try{r=t.calc(v)}catch(e){o.innerHTML='<div class="res err">คำนวณไม่สำเร็จ กรุณาตรวจสอบตัวเลข</div>';return}
 if(r.err){o.innerHTML='<div class="res err">'+r.err+'</div>';return}
 ui.last={t:t.title,s:t.title+'\n'+r.rows.map(function(x){return x[0]+': '+x[1]}).join('\n')};
 o.innerHTML='<div class="res">'+r.rows.map(function(x){return '<div>'+x[0]+'</div><div class="big">'+x[1]+'</div>'}).join('')+'<h3>วิธีคำนวณ</h3><ul>'+r.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul></div><div class="note w">'+r.note+'</div><button class="btn sec" data-act="tcopy">คัดลอกผลลัพธ์</button><button class="btn sec" data-act="tsave">บันทึกผลลงประวัติ</button>';
}

function srch(q){q=q.trim().toLowerCase();if(!q)return '';var r=[];
 TOOLS.forEach(function(t,i){if((t.title+t.desc+t.name).toLowerCase().indexOf(q)>-1)r.push('<button class="chip" data-act="gotool" data-i="'+i+'">เครื่องมือ: '+t.name+'</button>')});
 DICT.forEach(function(d){if((d[0]+d[1]+d[2]).toLowerCase().indexOf(q)>-1)r.push('<button class="chip" data-act="dgo" data-k="'+esc(d[0])+'">ศัพท์: '+esc(d[0])+'</button>')});
 LESS.forEach(function(l,i){if(l.t.toLowerCase().indexOf(q)>-1)r.push('<button class="chip" data-act="lopen" data-i="'+i+'">บทเรียน: บทที่ '+(i+1)+'</button>')});
 return r.length?'<div class="chips" style="flex-wrap:wrap">'+r.slice(0,10).join('')+'</div>':'<p>ไม่พบผลลัพธ์ ลองคำอื่น เช่น CBM, EOQ, Lead Time</p>'}
function dleft(x){if(!/^\d{4}-\d\d-\d\d$/.test(String(x.d)))return null;return Math.round((new Date(x.d+'T00:00:00')-new Date(iso()+'T00:00:00'))/864e5)}
function dateLabel(x){var n=dleft(x);if(n===null)return 'ไม่ระบุวันที่';var s=new Date(x.d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});if(x.done)return s;return s+' | '+(n<0?'<span class="late">เลยกำหนด '+(-n)+' วัน</span>':n===0?'<b>วันนี้</b>':'อีก '+n+' วัน')}
function homeView(){var h=homeView0(),td=S.todo.filter(function(x){return !x.done&&dleft(x)!==null}).sort(function(a,b){return a.d<b.d?-1:1}).slice(0,3);
 var ex='<div class="card"><label for="gs" style="margin-top:0">ค้นหาในแอป</label><input id="gs" type="search" placeholder="เช่น CBM, EOQ, Lead Time" autocomplete="off"><div id="sres"></div></div>'
 +'<div class="grid"><button class="card" data-act="go" data-v="dict"><b>พจนานุกรม</b><br><small>ศัพท์ อังกฤษ-ไทย</small></button><button class="card" data-act="go" data-v="work"><b>พื้นที่ของฉัน</b><br><small>งาน โน้ต สำรองข้อมูล</small></button></div>'
 +'<div class="card"><h3 style="margin-top:0">งานและกำหนดส่งที่ใกล้ถึง</h3>'+(td.length?td.map(function(x){return '<p><b>'+esc(x.t)+'</b> ('+esc(x.ty)+')<br>'+dateLabel(x)+'</p>'}).join(''):'<p>ยังไม่มีงานที่ระบุวันกำหนด</p><button class="btn sec" data-act="go" data-v="work">เพิ่มงานหรือวันสอบ</button>')+'</div>';
 return h.replace('<div class="grid">',ex+'<div class="grid">')}
function moreView(){return '<h2>เพิ่มเติม</h2><button class="card" data-act="go" data-v="lessons"><b>บทเรียน</b><br><small>6 บท ภาษาไทย</small></button><button class="card" data-act="go" data-v="quiz"><b>แบบทดสอบ</b><br><small>15 ข้อ พร้อมเฉลย</small></button><button class="card" data-act="go" data-v="game"><b>เกมจำลองการขนส่ง</b><br><small>4 สถานการณ์</small></button><div class="card"><h3 style="margin-top:0">กำลังจะมา</h3><ul><li>Phase 2: Warehouse (ABC Analysis), Transportation (Container Loading, Distance), Supply Chain</li><li>Phase 3: Import/Export และ Project Toolkit</li><li>Phase 4: Study Center ขยาย และคลังข้อสอบ 50 ข้อ</li><li>Phase 5: Simulation Lab, Internship</li><li>Phase 6: QA และ Accessibility</li></ul></div>'}

/* ---------- พื้นที่ของฉัน ---------- */
function wTodo(){
 var h='<div class="card"><h3 style="margin-top:0">เพิ่มงาน วันสอบ หรือกำหนดส่ง</h3><label for="tt">ชื่อรายการ</label><input id="tt" type="text" maxlength="100"><label for="td">วันที่กำหนด (ไม่บังคับ)</label><input id="td" type="date"><label for="ty">ประเภท</label><select id="ty"><option>งาน</option><option>สอบ</option><option>ส่งงาน</option><option>อื่น ๆ</option></select><button class="btn" data-act="tadd">เพิ่มรายการ</button></div>';
 var L=S.todo.slice().sort(function(a,b){if(!!a.done!==!!b.done)return a.done?1:-1;return (a.d||'9')<(b.d||'9')?-1:1});
 if(!L.length)return h+'<div class="card"><p>ยังไม่มีรายการ เพิ่มวันสอบหรือกำหนดส่งงานด้านบนได้เลย</p></div>';
 return h+L.map(function(x){return '<div class="card"><p'+(x.done?' style="text-decoration:line-through;opacity:.6"':'')+'><b>'+esc(x.t)+'</b> ('+esc(x.ty)+')</p><p>'+dateLabel(x)+'</p><button class="btn ok" data-act="ttog" data-k="'+esc(x.id)+'">'+(x.done?'ยกเลิกเสร็จ':'ทำเสร็จแล้ว')+'</button><button class="btn sec" data-act="tdel" data-k="'+esc(x.id)+'">ลบ</button></div>'}).join('')}
function wNotes(){var e=ui.ne?S.notes.filter(function(n){return n.id===ui.ne})[0]:null;
 var h='<div class="card"><h3 style="margin-top:0">'+(e?'แก้ไขโน้ต':'โน้ตใหม่')+'</h3><label for="nt">หัวข้อ</label><input id="nt" type="text" maxlength="100" value="'+(e?esc(e.t):'')+'"><label for="nb">เนื้อหา</label><textarea id="nb" rows="5">'+(e?esc(e.b):'')+'</textarea><button class="btn" data-act="nsave">บันทึกโน้ต</button>'+(e?'<button class="btn sec" data-act="ncancel">ยกเลิก</button>':'')+'</div>';
 if(!S.notes.length)return h+'<div class="card"><p>ยังไม่มีโน้ต</p></div>';
 return h+S.notes.map(function(n){return '<div class="card"><b>'+esc(n.t)+'</b><p style="white-space:pre-wrap">'+esc(n.b)+'</p><button class="btn sec" data-act="nedit" data-k="'+esc(n.id)+'">แก้ไข</button><button class="btn sec" data-act="ndel" data-k="'+esc(n.id)+'">ลบ</button></div>'}).join('')}
function wFav(){if(!S.fav.length)return '<div class="card"><p>ยังไม่มีรายการโปรด กดปุ่มบันทึกในหน้าเครื่องมือหรือพจนานุกรมได้เลย</p></div>';
 return S.fav.map(function(k){var s=String(k),n=s.slice(2),lb=s.charAt(0)==='d'?'ศัพท์':'เครื่องมือ';return '<div class="card"><b>'+lb+': '+esc(n)+'</b><br><button class="btn" data-act="fopen" data-k="'+esc(s)+'">เปิด</button><button class="btn sec" data-act="fav" data-k="'+esc(s)+'">เอาออก</button></div>'}).join('')}
function wHist(){if(!S.hist.length)return '<div class="card"><p>ยังไม่มีประวัติ กด บันทึกผลลงประวัติ หลังคำนวณในหน้าเครื่องมือ</p></div>';
 return '<button class="btn warn" data-act="hclear">ล้างประวัติทั้งหมด</button>'+S.hist.map(function(x){return '<div class="card"><b>'+esc(x.t)+'</b> <small>'+esc(x.d)+'</small><p style="white-space:pre-wrap">'+esc(x.s)+'</p><button class="btn sec" data-act="hcopy" data-k="'+esc(x.id)+'">คัดลอก</button><button class="btn sec" data-act="hdel" data-k="'+esc(x.id)+'">ลบ</button></div>'}).join('')}
function backup(){var d={};KEYS.forEach(function(k){d[k]=S[k]});return{app:'LogiPocket',v:1,saved:new Date().toISOString(),data:d}}
function wBack(){return '<div class="note w"><b>ข้อจำกัด:</b> ข้อมูลทั้งหมดอยู่ในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่ซิงก์ข้ามอุปกรณ์ และอาจหายเมื่อล้างข้อมูลเบราว์เซอร์ ควรสำรองข้อมูลเป็นระยะ</div><div class="card"><h3 style="margin-top:0">สำรองข้อมูล</h3><textarea id="bk" rows="5" readonly>'+esc(JSON.stringify(backup()))+'</textarea><button class="btn" data-act="bcopy">คัดลอกข้อมูลสำรอง</button><button class="btn sec" data-act="bdl">ดาวน์โหลดไฟล์ .json</button></div><div class="card"><h3 style="margin-top:0">กู้คืนข้อมูล</h3><label for="impf">เลือกไฟล์สำรอง</label><input id="impf" type="file" accept=".json,application/json"><label for="imp">หรือวางข้อมูล JSON ที่นี่</label><textarea id="imp" rows="4"></textarea><button class="btn warn" data-act="bimp">กู้คืนข้อมูล</button></div>'}
function workView(){var tabs=['งานและปฏิทิน','โน้ต','รายการโปรด','ประวัติคำนวณ','สำรองข้อมูล'];
 return '<h2>พื้นที่ของฉัน</h2><div class="chips">'+tabs.map(function(x,i){return '<button class="chip'+(i===ui.w?' on':'')+'" data-act="wtab" data-i="'+i+'">'+x+'</button>'}).join('')+'</div>'+[wTodo,wNotes,wFav,wHist,wBack][ui.w]()}
function restore(){var raw=$('imp').value.trim();if(!raw){toast('วางข้อมูล JSON หรือเลือกไฟล์ก่อน');return}
 var o;try{o=JSON.parse(raw)}catch(e){toast('อ่านเป็น JSON ไม่ได้ ข้อมูลอาจไม่ครบ');return}
 if(!o||o.app!=='LogiPocket'||!o.data||typeof o.data!=='object'){toast('ไม่ใช่ไฟล์สำรองของ LogiPocket');return}
 var d=o.data,ok=true;['read','fav','todo','notes','hist'].forEach(function(k){if(!Array.isArray(d[k]))ok=false});['best','done','game'].forEach(function(k){if(typeof d[k]!=='number'||!isFinite(d[k]))ok=false});
 if(!ok){toast('โครงสร้างข้อมูลไม่ครบ');return}
 ask('การกู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมดในเครื่องนี้ ต้องการดำเนินการหรือไม่',function(){KEYS.forEach(function(k){S[k]=d[k]});save();toast('กู้คืนข้อมูลแล้ว')})}

/* ---------- render และตัวควบคุมใหม่ ---------- */
function render(){
 var grp={lessons:1,quiz:1,game:1};
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===(grp[ui.view]?'more':ui.view))});
 var V={home:homeView,tools:toolView,lessons:lessonsView,quiz:quizView,game:gameView,dict:dictView,work:workView,more:moreView};
 var h=V[ui.view]();
 if(ui.cf)h+='<div class="ov" role="alertdialog"><div class="card"><p>'+esc(ui.cf.msg)+'</p><button class="btn warn" data-act="cfy">ยืนยัน</button><button class="btn sec" data-act="cfn">ยกเลิก</button></div></div>';
 $('app').innerHTML=h;
}
function byId(L,id){for(var i=0;i<L.length;i++)if(L[i].id===id)return i;return -1}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,k=b.dataset.k,i;
 try{switch(a){
  case 'cfy':var f=ui.cf.fn;ui.cf=null;f();render();break;
  case 'cfn':ui.cf=null;render();break;
  case 'reset':ask('ต้องการล้างความคืบหน้าการเรียนทั้งหมดหรือไม่ (โน้ตและงานจะไม่ถูกลบ)',function(){S.read=[];S.best=0;S.done=0;S.game=0;save()});break;
  case 'tsave':if(ui.last){S.hist.unshift({id:uid(),t:ui.last.t,d:new Date().toLocaleString('th-TH'),s:ui.last.s});S.hist=S.hist.slice(0,50);save();toast('บันทึกผลแล้ว')}break;
  case 'tcopy':if(ui.last)copyText(ui.last.s);break;
  case 'fav':toggleFav(k);if(ui.view==='dict')$('dlist').innerHTML=dlist();else if(ui.view==='tools')b.textContent=favLbl(k);else render();break;
  case 'dfo':ui.df=!ui.df;render();break;
  case 'dgo':ui.d=k;ui.df=false;go('dict');break;
  case 'fopen':if(k.charAt(0)==='d'){ui.d=k.slice(2);ui.df=false;go('dict')}else{for(i=0;i<TOOLS.length;i++)if('t:'+TOOLS[i].name===k)ui.tool=i;go('tools')}break;
  case 'wtab':ui.w=Number(b.dataset.i);render();break;
  case 'tadd':var tt=$('tt').value.trim();if(!tt){toast('กรุณากรอกชื่อรายการ');break}S.todo.push({id:uid(),t:tt,d:$('td').value,ty:$('ty').value,done:false});save();render();break;
  case 'ttog':i=byId(S.todo,k);if(i>-1){S.todo[i].done=!S.todo[i].done;save();render()}break;
  case 'tdel':ask('ลบรายการนี้หรือไม่',function(){S.todo=S.todo.filter(function(x){return x.id!==k});save()});break;
  case 'nsave':var nt=$('nt').value.trim(),nb=$('nb').value;if(!nt&&!nb.trim()){toast('กรุณากรอกหัวข้อหรือเนื้อหา');break}i=ui.ne?byId(S.notes,ui.ne):-1;if(i>-1){S.notes[i].t=nt||'(ไม่มีหัวข้อ)';S.notes[i].b=nb}else S.notes.unshift({id:uid(),t:nt||'(ไม่มีหัวข้อ)',b:nb});ui.ne=null;save();render();break;
  case 'nedit':ui.ne=k;render();break;
  case 'ncancel':ui.ne=null;render();break;
  case 'ndel':ask('ลบโน้ตนี้หรือไม่',function(){S.notes=S.notes.filter(function(x){return x.id!==k});ui.ne=null;save()});break;
  case 'hcopy':i=byId(S.hist,k);if(i>-1)copyText(S.hist[i].s);break;
  case 'hdel':ask('ลบรายการประวัตินี้หรือไม่',function(){S.hist=S.hist.filter(function(x){return x.id!==k});save()});break;
  case 'hclear':ask('ล้างประวัติการคำนวณทั้งหมดหรือไม่',function(){S.hist=[];save()});break;
  case 'bcopy':copyText($('bk').value);break;
  case 'bdl':try{var bl=new Blob([JSON.stringify(backup(),null,1)],{type:'application/json'}),u=URL.createObjectURL(bl),an=document.createElement('a');an.href=u;an.download='logipocket-backup-'+iso()+'.json';document.body.appendChild(an);an.click();document.body.removeChild(an);setTimeout(function(){URL.revokeObjectURL(u)},1000);toast('ถ้าไม่มีไฟล์ขึ้น ให้ใช้ปุ่มคัดลอกแทน')}catch(x){toast('ดาวน์โหลดไม่ได้ ให้ใช้ปุ่มคัดลอกแทน')}break;
  case 'bimp':restore();break;
 }}catch(err){console.error(err);toast('เกิดข้อผิดพลาด ลองใหม่อีกครั้ง')}
});
document.addEventListener('input',function(e){var t=e.target;if(t.id==='gs')$('sres').innerHTML=srch(t.value);else if(t.id==='dq'){ui.d=t.value;$('dlist').innerHTML=dlist()}});
document.addEventListener('change',function(e){if(e.target.id==='impf'){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('imp').value=String(r.result)};r.readAsText(f)}});

render();
</script>
</body>
</html>
